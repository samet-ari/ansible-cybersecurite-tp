---
- name: Installer et configurer le pare-feu UFW
  hosts: webservers
  become: true

  tasks:
    - name: Installer ufw
      ansible.builtin.apt:
        name: ufw
        state: present
        update_cache: yes

    - name: Définir la politique par défaut - refuser le trafic entrant
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: Définir la politique par défaut - autoriser le trafic sortant
      community.general.ufw:
        direction: outgoing
        policy: allow

    - name: Autoriser les connexions SSH (port actuel 22)
      community.general.ufw:
        rule: allow
        port: '22'
        proto: tcp

    - name: Autoriser HTTP (port 80)
      community.general.ufw:
        rule: allow
        port: '80'
        proto: tcp

    - name: Autoriser HTTPS (port 443)
      community.general.ufw:
        rule: allow
        port: '443'
        proto: tcp

    - name: Activer ufw
      community.general.ufw:
        state: enabled
