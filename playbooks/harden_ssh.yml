---
- name: Durcir la configuration SSH sur toutes les cibles
  hosts: all_servers
  become: true

  tasks:
    - name: Désactiver la connexion de l'utilisateur root
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin no'
        state: present
      notify: Recharger SSH

    - name: Désactiver l'authentification par mot de passe
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
        state: present
      notify: Recharger SSH

    - name: Désactiver X11Forwarding
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?X11Forwarding'
        line: 'X11Forwarding no'
        state: present
      notify: Recharger SSH

    - name: Vérifier la syntaxe de la configuration SSH avant rechargement
      ansible.builtin.command: sshd -t
      changed_when: false

  handlers:
    # NOTE : dans cet environnement de conteneurs Docker, sshd tourne en PID 1
    # (pas de systemd). Un "restart" classique tuerait le PID 1 et arrêterait
    # le conteneur. On envoie donc un signal SIGHUP pour recharger la
    # configuration sans interrompre le service.
    - name: Recharger SSH
      ansible.builtin.command: pkill -HUP -x sshd
      changed_when: false
