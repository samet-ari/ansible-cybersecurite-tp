---
- name: Bloc de durcissement SSH
  block:
    - name: Désactiver la connexion de l'utilisateur root
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin no'
        state: present
      notify: Recharger SSH

    - name: Désactiver l'authentification par mot de passe
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
        state: present
      notify: Recharger SSH

    - name: Désactiver X11Forwarding
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?X11Forwarding'
        line: 'X11Forwarding no'
        state: present
      notify: Recharger SSH

    - name: Vérifier la syntaxe de la configuration SSH avant rechargement
      ansible.builtin.command: sshd -t
      changed_when: false
  rescue:
    - name: Alerter en cas d'échec du durcissement SSH
      ansible.builtin.debug:
        msg: "ATTENTION : le durcissement SSH a échoué sur {{ inventory_hostname }}, vérification manuelle requise."
